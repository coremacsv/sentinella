# Controllo automatico di Sentinella, a ogni pubblicazione.
# Gira su computer Windows di GitHub, accesi per l'occasione e cancellati
# alla fine: nulla di tutto questo tocca il PC di chi sviluppa o usa Sentinella.
name: Verifica

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualita:
    name: Test, analisi del codice, firme
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test automatici (Pester 3.4, incluso in Windows)
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 3.4.0
          $r = Invoke-Pester .\test -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) test falliti" }

      - name: Sintassi di tutti gli script
        shell: powershell
        run: |
          $rotti = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [void][Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e.Count) { $rotti++; Write-Host "::error file=$($_.FullName)::$($e[0].Message)" }
          }
          if ($rotti) { throw "$rotti file con errori di sintassi" }

      - name: Firme digitali intatte
        shell: powershell
        run: |
          . .\moduli\Integrita.ps1
          $file = @('sentinella.ps1') + (Get-ChildItem moduli -Filter *.ps1 | ForEach-Object { "moduli\$($_.Name)" })
          $guai = 0
          foreach ($f in $file) {
            $s = Get-AuthenticodeSignature $f
            $ok = $s.Status -in @('Valid', 'UnknownError') -and $s.SignerCertificate.Thumbprint -eq $improntaFirmaAttesa
            Write-Host ("{0,-28} {1}" -f $f, $(if ($ok) { 'firmato, integro' } else { "PROBLEMA: $($s.Status)" }))
            if (-not $ok) { $guai++ }
          }
          if ($guai) { throw "$guai file non firmati o modificati dopo la firma: rilancia strumenti\Firma-Sentinella.ps1" }

      - name: Analisi del codice (PSScriptAnalyzer, solo errori)
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck | Out-Null
          $r = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error)
          $r | Format-Table RuleName, ScriptName, Line, Message -AutoSize | Out-String -Width 250 | Write-Host
          if ($r.Count) { throw "$($r.Count) errori segnalati da PSScriptAnalyzer" }

  banco:
    name: Banco di prova (tracce finte)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Piazza tracce finte e misura quante ne rileva Sentinella
        shell: powershell
        run: |
          .\test\banco\Banco-di-prova.ps1 -Sentinella $env:GITHUB_WORKSPACE -Risultati "$env:RUNNER_TEMP\risultati" -Modo Rapida

      - name: Conserva i risultati
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risultati-banco
          path: ${{ runner.temp }}/risultati
